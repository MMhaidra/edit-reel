[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-reel"
version = "1.0.0"
description = "Open-Source AI Video Editor & Auto Subtitles Generator for Instagram Reels, TikTok & YouTube Shorts — Autonomous Python Video Editing Agent & Skill for Claude Code, Cursor, Codex & Google Antigravity"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mohammed Mhaidra"}
]
keywords = [
    "ai-video-editor",
    "short-form-video",
    "auto-subtitles",
    "video-editing",
    "instagram-reels",
    "tiktok",
    "youtube-shorts",
    "claude-code",
    "claude-skills",
    "cursor",
    "antigravity",
    "codex",
    "agentic-ai",
    "mediapipe",
    "whisper",
    "faster-whisper",
    "ffmpeg",
    "motion-graphics",
    "video-automation",
    "caption-generator",
    "silence-removal",
    "talking-head"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "mediapipe>=0.10.14",
    "faster-whisper>=1.0.0",
    "python-docx>=1.1.0",
    "tqdm>=4.66.0"
]

[project.urls]
Homepage = "https://github.com/MMhaidra/edit-reel"
Repository = "https://github.com/MMhaidra/edit-reel"
Issues = "https://github.com/MMhaidra/edit-reel/issues"

[project.scripts]
edit-reel = "scripts.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "motion_library*"]
exclude = ["assets*", "models*", "templates*", "references*", "docs*", ".claude*"]

[tool.setuptools.package-data]
motion_library = ["**/*"]

