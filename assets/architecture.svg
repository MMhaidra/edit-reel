<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#2D2D32" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">edit-reel</text>
  <text x="180" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF">|  Autonomous 3-State Visual Rhythm &amp; Physical Editorial Pipeline</text>

  <!-- Panel 1: Real Studio -->
  <g transform="translate(60, 105)" filter="url(#shadow)">
    <rect width="320" height="260" rx="12" fill="#1E1E22" stroke="#374151" stroke-width="1.5"/>
    <rect x="20" y="20" width="280" height="150" rx="8" fill="#2A2A30"/>
    <circle cx="160" cy="85" r="30" fill="#4B5563"/>
    <path d="M120 145 C120 120 200 120 200 145 Z" fill="#4B5563"/>
    <rect x="40" y="185" width="240" height="20" rx="4" fill="#3B82F6" opacity="0.2"/>
    <text x="160" y="199" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">STATE 1: REAL CAMERA STUDIO</text>
    <text x="160" y="235" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#D1D5DB" text-anchor="middle">Speaker Hook &amp; Narrative Pauses</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 405 235 L 435 235" stroke="#4B5563" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="435,231 443,235 435,239" fill="#4B5563"/>

  <!-- Panel 2: Lowered Cutout on Paper -->
  <g transform="translate(460, 105)" filter="url(#shadow)">
    <rect width="320" height="260" rx="12" fill="#E2DDD1" stroke="#D1C7B7" stroke-width="1.5"/>
    <!-- Notebook Paper Cutoff -->
    <rect x="35" y="25" width="250" height="65" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="60" y1="25" x2="60" y2="90" stroke="#F87171" stroke-width="1.5"/>
    <line x1="70" y1="42" x2="270" y2="42" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="70" y1="60" x2="270" y2="60" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="70" y1="78" x2="240" y2="78" stroke="#E5E7EB" stroke-width="1"/>
    <text x="75" y="47" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#1F2937">CITATION: Empirical Study (2024)</text>
    <!-- Hanging Price Tag -->
    <g transform="translate(195, 100)">
      <line x1="30" y1="-10" x2="30" y2="10" stroke="#52525B" stroke-width="1.5"/>
      <rect x="0" y="10" width="80" height="42" rx="4" fill="#F4F0E8" stroke="#D6D3CD" stroke-width="1.5"/>
      <circle cx="30" cy="18" r="3" fill="#C9A227"/>
      <text x="40" y="38" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#BA1828" text-anchor="middle">$75,000</text>
    </g>
    <!-- Cutout Silhouette on lower half -->
    <path d="M70 240 C70 160 140 160 140 240 Z" fill="#2D2D32"/>
    <circle cx="105" cy="140" r="18" fill="#2D2D32"/>
    <rect x="40" y="195" width="240" height="20" rx="4" fill="#00704A" opacity="0.15"/>
    <text x="160" y="209" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#00704A" text-anchor="middle">STATE 2: CUTOUT ON PAPER</text>
    <text x="160" y="242" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#262320" text-anchor="middle">Tactile Objects &amp; Loading Odometers</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 805 235 L 835 235" stroke="#4B5563" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="835,231 843,235 835,239" fill="#4B5563"/>

  <!-- Panel 3: Full-Screen Infographic -->
  <g transform="translate(860, 105)" filter="url(#shadow)">
    <rect width="280" height="260" rx="12" fill="#E2DDD1" stroke="#D1C7B7" stroke-width="1.5"/>
    <!-- Comparative Parallel Graphs -->
    <rect x="25" y="25" width="110" height="135" rx="6" fill="#F4F0E8" stroke="#D1C7B7"/>
    <path d="M35 135 L125 45" stroke="#9CA3AF" stroke-width="2.5"/>
    <text x="80" y="152" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#6B7280" text-anchor="middle">LINEAR MYTH</text>

    <rect x="145" y="25" width="110" height="135" rx="6" fill="#F4F0E8" stroke="#D1C7B7"/>
    <path d="M155 135 Q180 60 245 50" stroke="#00704A" stroke-width="2.5" fill="none"/>
    <text x="200" y="152" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#00704A" text-anchor="middle">LOG REALITY</text>

    <rect x="25" y="185" width="230" height="20" rx="4" fill="#D97706" opacity="0.2"/>
    <text x="140" y="199" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">STATE 3: FULL INFOGRAPHIC</text>
    <text x="140" y="235" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#262320" text-anchor="middle">Comparative Parallel Coordinate Plots</text>
  </g>
</svg>
